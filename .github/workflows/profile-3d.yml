name: profile-3d-chart
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Build stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/build_stats_svg.py
      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets
          git commit -m "Update contribution charts" || exit 0
          git push
